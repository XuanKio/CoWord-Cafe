<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co-Working Cafe - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f6f1eb;
      overflow: hidden;
      position: relative;
    }

    /* Soft moving light background */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(111,78,55,0.15), transparent 70%);
      top: -150px;
      left: -150px;
      animation: moveLight 18s infinite alternate ease-in-out;
    }

    body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(166,124,82,0.15), transparent 70%);
      bottom: -150px;
      right: -150px;
      animation: moveLight 20s infinite alternate ease-in-out;
    }

    @keyframes moveLight {
      from { transform: translate(0, 0); }
      to { transform: translate(60px, 40px); }
    }

    .login-container {
      position: relative;
      background: white;
      width: 380px;
      padding: 45px;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(111,78,55,0.15);
      transition: 0.3s;
      z-index: 10;
    }

    .login-container:hover {
      transform: translateY(-6px);
      box-shadow: 0 35px 80px rgba(111,78,55,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 600;
      color: #6F4E37;
    }

    .logo p {
      font-size: 14px;
      color: #9b7b63;
      margin-top: 5px;
    }

    .input-group {
      margin-bottom: 22px;
    }

    .input-group label {
      font-size: 13px;
      color: #7a5c45;
      margin-bottom: 6px;
      display: block;
    }

    .input-group input {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #e5dcd3;
      background: #faf7f3;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #a67c52;
      background: white;
      box-shadow: 0 0 0 3px rgba(166,124,82,0.15);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #6F4E37;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #5a3e2b;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(111,78,55,0.3);
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #b9a899;
    }

    @media (max-width: 420px) {
      .login-container {
        width: 90%;
        padding: 35px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <h1>Co-Working Cafe</h1>
      <p>Đăng nhập hệ thống</p>
    </div>

    <form>
      <div class="input-group">
        <label>Số điện thoại / Username</label>
        <input type="text" placeholder="Nhập thông tin..." required />
      </div>

      <div class="input-group">
        <label>Mật khẩu</label>
        <input type="password" placeholder="••••••••" required />
      </div>

      <button class="login-btn">ĐĂNG NHẬP</button>
    </form>

    <div class="footer">
      © 2026 CoWorking Cafe System
    </div>
  </div>

</body>
</html>
