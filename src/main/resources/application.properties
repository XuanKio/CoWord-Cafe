spring.application.name=CoWordPTIT

# Server
server.port=8080

# Database - MySQL 8+
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/coworking_cafe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Hoangxuancuong06@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
# "create" = xoa va tao lai tat ca bang moi lan start -> dam bao schema luon khop entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Quan trong: tu dong them backtick `` quanh ten bang/cot
# Tranh loi voi reserved keywords nhu Sessions, Transactions
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
