<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoWorking Cafe - Trang khách hàng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/user-page.css" />
</head>

<body>

  <!-- ===== TOP BAR ===== -->
  <header class="user-topbar">
    <div class="user-topbar-logo">
      <i class="fa-solid fa-mug-hot"></i>
      <span>CoWorking Cafe</span>
    </div>
    <div class="user-topbar-actions">
      <span class="open-badge">
        <i class="fa-solid fa-circle-dot" style="color:#22c55e"></i> Đang mở cửa
      </span>
      <button id="btnLogout" class="btn-outline" style="display:none">
        <i class="fa-solid fa-sign-out-alt"></i> Đăng xuất
      </button>
    </div>
  </header>

  <main class="user-container">

    <div id="dashboardSection" style="display:none">

      <!-- Lời chào -->
      <div class="welcome-banner">
        <div class="welcome-icon"><i class="fa-solid fa-mug-saucer"></i></div>
        <div>
          <h2>Xin chào, <span id="welcomeName">—</span>!</h2>
          <p>Chào mừng bạn đến với CoWorking Cafe</p>
        </div>
      </div>

      <!-- Thông tin tài khoản -->
      <div class="user-card user-account-card">
        <div class="section-header user-account-header">
          <h3><i class="fa-solid fa-id-card"></i> Thông tin tài khoản</h3>
        </div>
        <div id="userInfoPanel">
          <div class="user-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div>
        </div>
      </div>

      <section class="user-card">
        <div class="section-header" style="margin-bottom:14px">
          <h3><i class="fa-solid fa-compass"></i> Khu vực thao tác nhanh</h3>
        </div>

        <div id="userMainTabs" class="user-main-tabs">
          <button class="user-main-tab-btn active" data-tab="sessions"><i class="fa-solid fa-calendar-check"></i> Lịch sử phiên</button>
          <button class="user-main-tab-btn" data-tab="packages"><i class="fa-solid fa-box-open"></i> Gói nạp</button>
          <button class="user-main-tab-btn" data-tab="drinks"><i class="fa-solid fa-mug-saucer"></i> Đồ uống</button>
          <button class="user-main-tab-btn" data-tab="foods"><i class="fa-solid fa-burger"></i> Đồ ăn</button>
        </div>

        <div id="userMainTabPanels">
          <div id="tabPanel-sessions" class="user-main-tab-panel">
            <div id="myBookingsList" class="bookings-list"></div>
            <div class="list-pagination" id="sessionsPagination"></div>
          </div>

          <div id="tabPanel-packages" class="user-main-tab-panel" style="display:none">
            <div id="orderPackagesList" class="order-items-grid"></div>
            <div class="list-pagination" id="packagesPagination"></div>
          </div>

          <div id="tabPanel-drinks" class="user-main-tab-panel" style="display:none">
            <div id="orderDrinksList" class="order-items-grid"></div>
            <div class="list-pagination" id="drinksPagination"></div>
          </div>

          <div id="tabPanel-foods" class="user-main-tab-panel" style="display:none">
            <div id="orderFoodsList" class="order-items-grid"></div>
            <div class="list-pagination" id="foodsPagination"></div>
          </div>
        </div>

        <div id="orderFooter" class="order-footer" style="display:none">
          <div id="orderTotal" class="order-total">Chưa chọn gì</div>
          <button id="btnSubmitOrder" class="btn-primary" onclick="submitOrder()" disabled>
            <i class="fa-solid fa-paper-plane"></i> Gửi yêu cầu
          </button>
        </div>
      </section>

    </div><!-- end dashboardSection -->

  </main>


  <!-- Role Guard: ch\u1ec9 USER m\u1edbi \u0111\u01b0\u1ee3c v\u00e0o trang n\u00e0y -->
  <script>
    (function () {
      var u = JSON.parse(localStorage.getItem('user') || '{}');
      if (u.role !== 'USER' || !u.token) {
        localStorage.removeItem('user');
        window.location.href = '/login.html';
      }
    })();
  </script>
  <script type="module" src="/js/user-page.js"></script>
</body>

</html>
